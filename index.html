<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Regression Applications in Health Sciences</title>
  <meta name="robots" content="noindex, noarchive">
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
    header{padding:8px 12px;background:#0B3A66;color:#fff;font-size:15px;font-weight:700;}
    .w{position:relative;height:calc(100% - 36px);background:#fff;}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}

    /* Block clicks bottom-right WITHOUT visual box (like your original) */
    .b{
      position:absolute;right:0;bottom:0;
      width:96px;height:96px;
      pointer-events:auto;
      background:transparent;
      z-index:9999;
    }
    @media(max-width:600px){.b{width:72px;height:72px;}}
  </style>
</head>
<body>
  <header>Regression Applications in Health Sciences</header>
  <div class="w">
    <iframe id="f" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
    <div class="b" aria-hidden="true"></div>
  </div>
  <script>
    (function(){
      // base64("https://regression-myapp.streamlit.app/?embed=true")
      var s="aHR0cHM6Ly9yZWdyZXNzaW9uLW15YXBwLnN0cmVhbWxpdC5hcHAvP2VtYmVkPXRydWU=";
      var base=atob(s);
      var qs=window.location.search;
      var url=base;
      if(qs&&qs.length>1){url=base+"&"+qs.substring(1);}
      document.getElementById("f").src=url;
    })();
  </script>
</body>
</html>
