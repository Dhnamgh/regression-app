<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Regression Applications in Health Sciences</title>
  <meta name="robots" content="noindex, noarchive">

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:#fff;
    }

    header{
      height:40px;
      padding:8px 14px;
      box-sizing:border-box;
      background:#0B3A66;
      color:#fff;
      font-size:15px;
      font-weight:700;
      display:flex;
      align-items:center;
    }

    .wrap{
      position:relative;
      height:calc(100% - 40px);
      background:#fff;
      overflow:hidden;
    }

    iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }

    /* 🔒 Footer block (footer / badge / menu Streamlit) */
    .footer-block{
      position:absolute;
      right:0;
      bottom:0;
      width:130px;
      height:130px;
      background:#fff;
      z-index:9999;
      pointer-events:auto;
    }

    /* Mobile */
    @media (max-width: 768px){
      .footer-block{
        width:90px;
        height:90px;
      }
    }
  </style>
</head>

<body>
  <header>Regression Applications in Health Sciences</header>

  <div class="wrap">
    <iframe
      id="app"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer"
    ></iframe>

    <!-- overlay che footer -->
    <div class="footer-block" aria-hidden="true"></div>
  </div>

  <script>
    (function(){
      // base64("https://regression-myapp.streamlit.app/?embed=true")
      var s = "aHR0cHM6Ly9yZWdyZXNzaW9uLW15YXBwLnN0cmVhbWxpdC5hcHAvP2VtYmVkPXRydWU=";
      var url = atob(s);

      // Forward query params (optional)
      var qs = window.location.search;
      if(qs && qs.length > 1){
        url += "&" + qs.substring(1);
      }

      document.getElementById("app").src = url;
    })();
  </script>
</body>
</html>
